[project]
name = "doc-review-backend"
version = "0.1.0"
description = "文档审查智能体后端：FastAPI 审查流水线 + 规则引擎 + 模型网关 + 评分引擎"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlmodel==0.0.22",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.12",
    "openai>=1.59,<2",
    "rapidfuzz==3.10.0",
    "python-docx==1.1.2",
    "pypdf==5.0.1",
    "celery==5.4.0",
    "redis==5.0.8",
]

[tool.uv]
# 应用项目（非库）：不构建/安装自身，app 包通过 `uvicorn app.main:app` 直接运行
package = false

[tool.pytest.ini_options]
# app 包未安装，运行测试时把 backend 根目录加入 sys.path 以便 `import app`
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
